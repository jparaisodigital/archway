<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employers | Archway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                colors: { primary: '#0B6E99', 'primary-dark': '#084F6F', accent: '#00C2CB' }
            }}
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; animation: fadeIn 0.4s ease-out; }
        a, button { transition: all 0.25s ease; }
        button:hover, a[class*="bg-primary"]:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(11, 110, 153, 0.25); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="app"></div>
    <script src="config.js"></script>
    <script src="site.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderEmployersPage);
    </script>
</body>
</html>
