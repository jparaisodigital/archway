<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Archway | Filipino Recruitment</title>
    
    <meta property="og:type" content="website">
    
    <meta property="og:title" content="Archway | Filipino Recruitment">
    
    <meta
    property="og:description"
    content="Connecting qualified Filipino talent with trusted local and overseas employers."
    >
    
    <meta
    property="og:url"
    content="https://archwayintl.com.ph/"
    >
    
    <meta
    property="og:image"
    content="https://archwayintl.com.ph/assets/link.png"
    >
    
    <meta
    property="og:image:width"
    content="1200"
    >
    
    <meta
    property="og:image:height"
    content="630"
    >
    
    <meta
    property="og:image:alt"
    content="Archway International & Mktg. Services, Inc."
    >
    
    <meta
    name="twitter:card"
    content="summary_large_image"
    >
    
    <meta
    name="twitter:title"
    content="Archway | Filipino Recruitment"
    >
    
    <meta
    name="twitter:description"
    content="Connecting qualified Filipino talent with trusted local and overseas employers."
    >
    
    <meta
    name="twitter:image"
    content="https://archwayintl.com.ph/assets/link.png"
    >
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
    >
    
    <!-- Tailwind Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        primary: '#0B6E99',
                        'primary-dark': '#084F6F',
                        accent: '#00C2CB'
                    }
                }
            }
        };
    </script>
    
    <style>
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition:
            opacity 0.4s ease-out,
            transform 0.4s ease-out;
        }
        
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .fade-in-content {
            animation: fadeIn 0.4s ease-out;
        }
        
        .hero-bg-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1.03);
            transition:
            opacity 1.6s ease-in-out,
            transform 5s ease-out;
            will-change: opacity, transform;
        }
        
        .hero-bg-image.active {
            opacity: 1;
            transform: scale(1);
        }
        
        .modal-backdrop {
            opacity: 0;
            transition: opacity 200ms ease;
        }
        
        .modal-panel {
            opacity: 0;
            transform: translateY(10px);
            transition:
            opacity 200ms ease,
            transform 200ms ease;
        }
        
        .modal-visible .modal-backdrop {
            opacity: 1;
        }
        
        .modal-visible .modal-panel {
            opacity: 1;
            transform: translateY(0);
        }
        
        #mobileMenu {
            transition: all 0.3s ease;
        }
        
        .site-navbar {
            transition:
            background-color 180ms ease,
            border-color 180ms ease,
            box-shadow 180ms ease;
        }
        
        .site-navbar.navbar-scrolled {
            background-color: rgb(2 6 23 / 0.98);
            border-bottom-color: rgb(51 65 85 / 0.75);
            box-shadow: 0 8px 24px rgb(2 6 23 / 0.12);
        }
        
        .toast-panel {
            opacity: 0;
            transform: translateY(8px);
            transition:
            opacity 180ms ease,
            transform 180ms ease;
        }
        
        .toast-visible .toast-panel {
            opacity: 1;
            transform: translateY(0);
        }
        
        .reveal-stagger > * {
            opacity: 0;
            transform: translateY(10px);
            transition:
            opacity 500ms ease,
            transform 500ms ease;
        }
        
        .reveal-stagger.reveal-visible > * {
            opacity: 1;
            transform: translateY(0);
        }
        
        .reveal-stagger.reveal-visible > *:nth-child(2) {
            transition-delay: 80ms;
        }
        
        .reveal-stagger.reveal-visible > *:nth-child(3) {
            transition-delay: 160ms;
        }
        
        .reveal-stagger.reveal-visible > *:nth-child(4) {
            transition-delay: 240ms;
        }
        
        .reveal-stagger.reveal-visible > *:nth-child(5) {
            transition-delay: 320ms;
        }
        
        .mobile-menu-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transform: translateY(-6px);
            pointer-events: none;
            
            background-color: rgb(2 6 23);
            
            transition:
            max-height 220ms ease,
            opacity 180ms ease,
            transform 180ms ease;
        }
        
        .mobile-menu-panel.mobile-menu-open {
            max-height: 420px;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        section[id] {
            scroll-margin-top: 80px;
        }
        
        .jobs-loaded {
            opacity: 0;
            transition: opacity 200ms ease;
        }
        
        .jobs-loaded.is-visible {
            opacity: 1;
        }
        
        #backToTop {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition:
            opacity 180ms ease,
            transform 180ms ease;
        }
        
        #backToTop.back-to-top-visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        .hero-bg-mobile {
            display: none;
        }
        
        @media (max-width: 767px) {
            .hero-bg-desktop {
                display: none;
            }
            
            .hero-bg-mobile {
                display: block;
            }
        }
        
        button,
        a,
        input,
        select,
        textarea {
            touch-action: manipulation;
        }
        
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }
        
        @media (max-width: 767px) {
            .hero-bg-mobile {
                background-size: cover;
                background-position: center center;
            }
        }
        
        .hero-trust-marquee {
            overflow: hidden;
            white-space: nowrap;
        }
        
        .hero-trust-track {
            display: flex;
            width: max-content;
            
            animation: heroTrustMarquee 24s linear infinite;
        }
        
        @media (max-width: 767px) {
            .hero-trust-track {
                animation-duration: 14s;
            }
        }
        
        .hero-trust-group {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 1.5rem;
            
            flex-shrink: 0;
            min-width: 100vw;
            
            padding: 0.9rem 1.5rem;
            
            color: rgb(255 255 255 / 0.82);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        
        .hero-trust-dot {
            color: rgb(0 194 203 / 0.9);
        }
        
        @keyframes heroTrustMarquee {
            from {
                transform: translateX(0);
            }
            
            to {
                transform: translateX(-50%);
            }
        }
        
    </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
    
    <div id="app"></div>
    
    <script src="config.js"></script>
    <script src="site.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            renderHomePage();
            
            fetchSiteSettings()
            .then(settings => {
                
                applySiteSettings(settings);
                
                if (typeof syncSiteSettingsUI === 'function') {
                    syncSiteSettingsUI();
                }
                
            })
            .catch(error => {
                
                console.warn(
                'Site settings could not be refreshed:',
                error
                );
                
            });
            
        });
    </script>
    
</body>

</html>
